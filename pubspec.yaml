name: ip_radio_app
description: "A basic Android radio station management app built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.1
  path: ^1.9.1
  shared_preferences: ^2.3.5
  just_audio: ^0.9.44
  audio_service: ^0.18.17
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
